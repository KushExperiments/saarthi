name: Build LifeOS APK

# This workflow originally ran at the repo root, which builds app/ — the
# LEGACY pre-modularization prototype — not android/, the active modular
# rewrite where all current work actually happens. It was silently
# producing an APK of the wrong, years-stale codebase under this
# friendly, easy-to-find name, while the correct build lived under the
# less obvious "Android Foundation CI (M-001)" workflow's
# lifeos-foundation-debug artifact instead. Retargeted at android/ so the
# obviously-named artifact people actually go looking for is the current
# one.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # lets you build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: android

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-app
          path: android/app/build/outputs/apk/debug/app-debug.apk
