name: Android Foundation CI (M-001)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-foundation-ci.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: android

      - name: ktlint (report only — see android/README.md)
        run: gradle ktlintCheck --continue || true

      - name: detekt (report only — see android/README.md)
        run: gradle detekt --continue || true

      - name: Unit tests (all modules)
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-foundation-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload lint/static-analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            android/**/build/reports/ktlint/**
            android/**/build/reports/detekt/**
