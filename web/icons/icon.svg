       overlapping wave lobes in blue/cyan/orange on a white rounded
       square, with a thin navy baseline threading underneath. Not a
       pixel-exact import (no way to pull the rendered canvas asset from
       a live design.com editor session), but matches the shapes, colors,
       and composition closely. -->
