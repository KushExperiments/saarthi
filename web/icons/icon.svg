  <path d="M30,70 C30,42 46,26 60,26 C74,26 90,42 90,70 C90,102 60,150 60,150 C60,150 30,102 30,70 Z" fill="#2f6fed"/>
  <path d="M67,100 C67,78 79,64 95,64 C111,64 123,78 123,100 C123,124 95,155 95,155 C95,155 67,124 67,100 Z" fill="#2bc6e8"/>
