<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c7">
<title>Saathi — Your Helper</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/style.css">

<!-- ============ HOME SCREEN ============ -->
<main id="home" class="screen active">
  <header class="topbar">
    <div class="clock" id="clock">--:--</div>
    <button class="iconbtn" id="setupBtn" title="Setup" aria-label="Setup">⚙️</button>
  </header>

  <div class="hello" id="hello">Hello 👋</div>

  <!-- Big talk button -->
  <button id="talkBtn" class="talk">
    <span class="mic">🎤</span>
    <span class="talklabel" id="talkLabel">Tap and talk to me</span>
  </button>

  <div class="heard" id="heard"></div>

  <!-- Big simple action cards -->
  <div class="grid">
    <button class="card" data-act="medicines"><span class="ico">💊</span><span>My Medicines</span></button>
    <button class="card" data-act="call"><span class="ico">📞</span><span>Call Someone</span></button>
    <button class="card" data-act="torch"><span class="ico">🔦</span><span>Torch</span></button>
    <button class="card" data-act="youtube"><span class="ico">▶️</span><span>YouTube</span></button>
    <button class="card" data-act="help"><span class="ico">❓</span><span>Help Me</span></button>
    <button class="card" data-act="repeat"><span class="ico">🔁</span><span>Say Again</span></button>
  </div>
</main>

<!-- ============ MEDICINES SCREEN ============ -->
<section id="medicines" class="screen">
  <header class="topbar">
    <button class="iconbtn" data-back>⬅️</button>
    <h2>My Medicines</h2>
    <span></span>
  </header>
  <div id="medList" class="list"></div>
  <button class="bigadd" id="addMedBtn">➕ Add a medicine</button>
</section>

<!-- ============ CONTACTS / CALL SCREEN ============ -->
<section id="call" class="screen">
  <header class="topbar">
    <button class="iconbtn" data-back>⬅️</button>
    <h2>Call Someone</h2>
    <span></span>
  </header>
  <div id="contactList" class="list"></div>
  <button class="bigadd" id="addContactBtn">➕ Add a person</button>
</section>

<!-- ============ SETUP SCREEN (for family/caregiver) ============ -->
<section id="setup" class="screen">
  <header class="topbar">
    <button class="iconbtn" data-back>⬅️</button>
    <h2>Setup</h2>
    <span></span>
  </header>
  <div class="setuprow">
    <label>Language I speak &amp; understand</label>
    <select id="langSel"></select>
  </div>
  <div class="setuprow">
    <label>How slow should I talk?</label>
    <input type="range" id="rateSel" min="0.5" max="1.1" step="0.05" value="0.8">
    <button class="testbtn" id="testVoice">🔊 Test voice</button>
  </div>
  <div class="setuprow">
    <label>Name to greet</label>
    <input type="text" id="userName" placeholder="e.g. Amma, Dad, Kamala">
  </div>
  <p class="hint">Tip: Add this page to your Home Screen so it opens like an app.
     Set up medicines and people here, then hand the phone to your elder — they only need the big buttons and the 🎤.</p>
</section>

<!-- ============ MEDICINE REMINDER OVERLAY ============ -->
<div id="reminder" class="overlay">
  <div class="rembox">
    <div class="rempill">💊</div>
    <div class="remtext" id="remText">Time for your medicine</div>
    <button class="took" id="tookBtn">✅ I took it</button>
    <button class="snooze" id="snoozeBtn">⏰ Remind me in 5 min</button>
  </div>
</div>

<!-- ============ SIMPLE FORM DIALOG ============ -->
<dialog id="formDlg">
  <form method="dialog" id="formEl">
    <h3 id="formTitle">Add</h3>
    <div id="formFields"></div>
    <menu>
      <button value="cancel" class="ghost">Cancel</button>
      <button value="ok" id="formOk">Save</button>
    </menu>
  </form>
</dialog>

<script src="js/app.js"></script>
